<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">The Intention Gap: will Generation Z have the families they say they want?</title>
<desc id="d">Line chart of the observed U.S. period total fertility rate from 1953 to 2024 (Human Fertility Database): a peak of 3.74 births per woman in 1957, falling to 1.59 in 2024. A dashed line holds the 2024 level flat to 2040 (1.593), the project's no-change forecast; its historical-error interval failed calibration and is not shown.</desc>
