# I publish the finished website only after I approve a public release.
# This workflow has no automatic trigger, and it refuses to deploy from a private repository.
name: Publish website (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "I approve publishing this website"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: intention-gap-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build approved website
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.private == false && inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: website
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check the frozen research and build at the repository subpath
        run: npm run build:pages

      - name: Check the release artifact
        run: test -s dist/index.html

      - name: Upload only the static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
        with:
          path: website/dist

  deploy:
    name: Deploy approved website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish the approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
